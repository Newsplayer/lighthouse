# Lighthouse builder configuration. Every setting is optional; defaults are shown.
#
# Boards come from three places (see MAINTAINING.md):
#   - config/companies.csv: large employers by careers page; the build finds each one's job board
#   - config/boards/*.csv: boards checked by hand (columns ats, slug, company, enabled)
#   - [[boards]] entries at the end of this file
# Careers systems and where the slug comes from:
#   greenhouse       job-boards.greenhouse.io/<slug>
#   lever            jobs.lever.co/<slug>
#   ashby            jobs.ashbyhq.com/<slug>
#   workable         apply.workable.com/<slug>
#   smartrecruiters  jobs.smartrecruiters.com/<CompanyId>   (case-sensitive)
#   recruitee        <slug>.recruitee.com
#   workday          <tenant>.wd<N>.myworkdayjobs.com/<Site>   ->  slug = "<tenant>.wd<N>/<Site>"

[settings]
ghost_age_days = 60              # open longer than this = one ghost signal
ghost_hide_signals = 3           # the website hides roles with this many signals by default
repost_gap_days = 7              # near-identical posting this much later = a repost
request_timeout_seconds = 20
per_host_requests_per_second = 4 # politeness limit per careers-system host, shared by all workers
fetch_workers = 16               # boards fetched in parallel (the build uses at least 48)
max_detail_calls_per_board = 150 # description calls per board per run; the rest fill in later (the build passes 1000)
fetch_minutes = 0                # start no new board after this many minutes (0 = no limit; the build uses 40)
disable_after_failures = 2       # switch off a board that reports "not found" this many runs in a row
skip_hourly_titles = true        # skip clearly hourly/frontline titles (warehouse, cashier, driver...)
inactive_content_retention_days = 180
closed_retention_days = 45       # delete postings closed this long ago (once no listing of the same role is open)
hold_mass_closures = true        # a board suddenly listing < half its 20+ open roles: close only if the next run agrees

# The gap fill: a free open model on the build machine reads the postings whose filter fields the rules
# couldn't settle, and fills only those gaps. No key or account. See MAINTAINING.md.
[index]
llm_fill = true
llm_minutes = 60                 # reading time per build; the LIGHTHOUSE_LLM_MINUTES repository variable overrides it
llm_parallel = 2

