# The builder, and the only thing that writes job data. Each run reads the job boards that are due,
# publishes jobs.db.xz, jobs.csv.gz and manifest.json on the "job-index" release, and deploys the
# website. A run stops itself in under an hour (snapshot.FETCH_MINUTES); boards it doesn't reach keep
# their postings and go first next run, so a cut-short run loses nothing.
# Setup, and what to do when it fails: MAINTAINING.md.
name: Job index

on:
  schedule:
    # Hourly, at :17 because GitHub delays scheduled runs at the top of the hour. Not every board is
    # read every run: fetch.not_due sets how often (Workday twice a day).
    - cron: "17 * * * *"
  workflow_dispatch:                # "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Look every listed company up again, and retry boards that were switched off"
        type: boolean
        default: false
  push:
    branches: [main]
    # A change to the lists or the builder queues a build right away. A change to site/ alone doesn't:
    # website.yml puts it live on the last build's data.
    paths: ["config/**", "lighthouse/**", "requirements.txt"]

permissions:
  contents: write                   # publish the release
  issues: write                     # keep one issue listing the boards that stopped answering

concurrency:
  group: job-index
  # One build at a time. GitHub keeps only the newest waiting run: starting one by hand while a build
  # runs replaces any run already waiting.
  cancel-in-progress: false

jobs:
  build:
    # Only main publishes: a run on another branch would put that branch's data on the release everyone
    # downloads. Test builds go through network-probe.yml (probe/run-build).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.upload.outcome }}
    timeout-minutes: 80              # a build stops itself within an hour; this only catches a stuck one
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The builder's working database, kept between runs, so each run only processes what changed.
      - name: Restore builder database
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}
          restore-keys: lighthouse-builder-

      # Cache lost (unused 7+ days, or evicted) but a database is published: start from it, so every
      # posting keeps its history. Its descriptions are read again as the boards are fetched.
      - name: Seed from the published database
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p data prev
          if gh release download job-index --pattern jobs.db.xz --dir prev 2>/dev/null \
             && python -m lighthouse index seed prev/jobs.db.xz; then
            echo "Seeded from the published database"
          else
            rm -f data/builder.db
            echo "First build: finding careers pages and fetching for half an hour; later runs fill in the rest"
          fi

      # The newest answers from the gap fill (fill.yml), which runs alongside builds and hands them over
      # in a small file. Merging is safe to repeat; a failure here never stops the build.
      - name: Restore the gap fill's answers
        id: answers
        uses: actions/cache/restore@v4
        with:
          path: data/answers.json.gz
          key: lighthouse-fill-${{ github.run_id }}     # never there: the newest lighthouse-fill-* is used
          restore-keys: lighthouse-fill-

      - name: Merge the gap fill's answers
        if: steps.answers.outputs.cache-matched-key != ''
        continue-on-error: true
        run: python -m lighthouse index merge data/answers.json.gz

      # --no-llm: the open model runs in fill.yml instead, so it never delays publishing.
      - name: Build
        run: >
          python -m lighthouse index build --out dist --no-llm
          --detail-calls 1000 --countries "${{ vars.LIGHTHOUSE_COUNTRIES || 'US,CA,MX' }}"
          --fetch-minutes "${{ vars.LIGHTHOUSE_FETCH_MINUTES }}"
          ${{ inputs.full && '--full' || '' }}

      - name: Publish
        run: |
          gh release view job-index >/dev/null 2>&1 || gh release create job-index --latest=false \
            --title "Job index" --notes "Built automatically by .github/workflows/job-index.yml. Open job postings read from employers' own careers sites: jobs.db.xz (SQLite) and jobs.csv.gz."
          # The same three names every build, so their download links never change.
          gh release upload job-index dist/jobs.db.xz dist/manifest.json --clobber
          [ -e dist/jobs.csv.gz ] && gh release upload job-index dist/jobs.csv.gz --clobber
          # Anything else on the release is left over from older builds.
          gh api "repos/${{ github.repository }}/releases/tags/job-index" --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case " jobs.db.xz manifest.json jobs.csv.gz " in *" $name "*) ;; *) gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" && echo "removed $name" ;; esac
          done
          # Shown on the run's summary page.
          python -m lighthouse index summary dist/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"

      # One issue lists the boards that haven't answered for two days or were switched off. It is
      # updated in place, and closed when every board answers again. Never stops the build.
      - name: Report boards that need a look
        continue-on-error: true
        run: |
          repo="${{ github.repository }}"
          title="Job boards that need a look"
          python -m lighthouse index summary dist/manifest.json --boards > boards.md
          n=$(gh api "repos/$repo/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
                --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ -s boards.md ] && [ -n "$(tr -d '[:space:]' < boards.md)" ]; then
            if [ -n "$n" ]; then gh api -X PATCH "repos/$repo/issues/$n" -F body=@boards.md --silent
            else gh api "repos/$repo/issues" -f title="$title" -F body=@boards.md --silent; fi
          elif [ -n "$n" ]; then
            gh api -X PATCH "repos/$repo/issues/$n" -f state=closed -f body="Every board answers again." --silent
          fi

      # The website (GitHub Pages): static files written from the same builder database. A failure here
      # never stops the index or the cache below; the site just keeps its previous version until next run.
      # Page files (site/) pushed to main while this build ran are already live (website.yml), so the
      # newest ones are used, unless main also changed how the files are written (lighthouse/).
      - name: Write the website
        id: site
        continue-on-error: true
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && git fetch --quiet --depth=1 origin main \
             && git diff --quiet HEAD FETCH_HEAD -- lighthouse/ requirements.txt; then
            git checkout FETCH_HEAD -- site/
          fi
          python -m lighthouse site --out site_out --countries "${{ vars.LIGHTHOUSE_COUNTRIES || 'US,CA,MX' }}"
          git rev-parse HEAD > site_built_from.txt

      # GitHub's artifact service can fail (2026-11-11: an error page for ten minutes). That must not fail
      # the job: the index is already published, and the builder database below has to be saved to match it.
      - name: Upload the website
        id: upload
        continue-on-error: true
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

      # Kept for website.yml: a push that changes only the page puts it live on this job data, no build.
      - name: Keep the website in the cache
        continue-on-error: true
        if: steps.site.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            site_out
            site_built_from.txt
          key: lighthouse-site-${{ github.run_id }}

      # Saved only after a successful publish, so the cache always matches what is published.
      - name: Save builder database
        uses: actions/cache/save@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}

  # Settings -> Pages -> Source: GitHub Actions (once). Each build replaces the whole site.
  deploy-site:
    needs: build
    if: needs.build.outputs.site == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:                    # one Pages deploy at a time, with website.yml
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # GitHub usually copies the site in under a minute, but on 2026-11-09 it was still "syncing files"
      # when the action's default 10-minute wait ran out, and the deploy was cancelled. Wait up to 30.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
