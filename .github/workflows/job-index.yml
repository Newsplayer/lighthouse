# Builds the shared job index and publishes it on this repo's "job-index" release.
# This is the only thing that writes job data; every user's Lighthouse just downloads it.
# Each run (about an hour): find job boards for config/companies.csv (careers pages, re-checked when
# due), fetch boards for 40 minutes (stalest first; what isn't reached goes first next run), clean,
# de-duplicate and analyse, then publish a ready-to-use database (or a small delta) and jobs.csv.gz.
# Setup and upkeep: MAINTAINING.md.
name: Job index

on:
  schedule:
    - cron: "17 */6 * * *"          # every 6 hours (UTC)
  workflow_dispatch:                # "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Publish a new full base file (instead of only the changes)"
        type: boolean
        default: false
  push:
    branches: [main]
    # Board or company lists edited, or the code that reads and writes job data changed: rebuild now,
    # so the change is live in about an hour instead of at the next 6-hourly run.
    paths: ["config/**", "lighthouse/**", "requirements.txt"]

permissions:
  contents: write                   # publish the release
  issues: write                     # keep one issue listing the boards that stopped answering

concurrency:
  group: job-index
  cancel-in-progress: false         # never two builds at once; a push waits for the scheduled run

jobs:
  build:
    # Only main publishes. A run started on another branch would put that branch's data on the
    # release everyone downloads (test builds: network-probe.yml with probe/run-build).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.site.outcome }}
    timeout-minutes: 100             # a build takes about an hour; this only catches a stuck one
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The builder's working database, kept between runs, so each run only processes what changed.
      - name: Restore builder database
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}
          restore-keys: lighthouse-builder-

      - name: Get the currently published manifest
        run: gh release download job-index --pattern manifest.json --dir prev 2>/dev/null || echo "Nothing published yet"

      # Cache expired (unused 7+ days) but an index exists: start from it instead of from scratch.
      - name: Seed from the published index
        if: steps.cache.outputs.cache-matched-key == ''
        run: |
          mkdir -p data
          base=$( [ -f prev/manifest.json ] && python -c "import json; print(json.load(open('prev/manifest.json'))['base']['file'])" || true)
          if [ -n "$base" ] && gh release download job-index --pattern "$base" --dir prev \
             && python -m lighthouse index seed "prev/$base"; then
            echo "Seeded from the published base"
          else
            rm -f data/builder.db
            echo "First build: finding careers pages and fetching for 40 minutes; later runs fill in the rest"
          fi

      # Rules only here: the open model reads afterwards (the fill job below), so it never delays new
      # postings. What it fills goes out with the next build.
      - name: Build
        run: >
          python -m lighthouse index build --out dist --published prev/manifest.json --no-llm
          --detail-calls 1000 --countries "${{ vars.LIGHTHOUSE_COUNTRIES || 'US,CA,MX' }}"
          --fetch-minutes "${{ vars.LIGHTHOUSE_FETCH_MINUTES }}"
          ${{ inputs.full && '--full' || '' }}

      - name: Publish
        run: |
          gh release view job-index >/dev/null 2>&1 || gh release create job-index --latest=false \
            --title "Job index" --notes "Built automatically by .github/workflows/job-index.yml. Public job postings only; read by Lighthouse."
          # Each build's files have their own names, and the manifest goes up last: readers never see a
          # manifest pointing at a file that isn't there yet, or a file that doesn't match it.
          for f in dist/*.db.xz; do [ -e "$f" ] && gh release upload job-index "$f" --clobber; done
          gh release upload job-index dist/manifest.json --clobber
          # The same jobs as one table (a column per filter), for people: spreadsheets, pandas.
          [ -e dist/jobs.csv.gz ] && gh release upload job-index dist/jobs.csv.gz --clobber
          # Then remove files the new manifest no longer names.
          keep=$(python -c "import json; m = json.load(open('dist/manifest.json')); print(' '.join(f['file'] for f in [m['base'], *m['deltas']]))")
          gh api "repos/${{ github.repository }}/releases/tags/job-index" --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            case " $keep manifest.json jobs.csv.gz " in *" $name "*) ;; *) gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" && echo "removed $name" ;; esac
          done
          # How the build went: on the run's summary page and in the log.
          python -m lighthouse index summary dist/manifest.json | tee -a "$GITHUB_STEP_SUMMARY"

      # One issue lists the boards that haven't answered for two days or were switched off. It is
      # updated in place, and closed when every board answers again. Never stops the build.
      - name: Report boards that need a look
        continue-on-error: true
        run: |
          repo="${{ github.repository }}"
          title="Job boards that need a look"
          python -m lighthouse index summary dist/manifest.json --boards > boards.md
          n=$(gh api "repos/$repo/issues?state=open&creator=github-actions%5Bbot%5D&per_page=100" \
                --jq "[.[] | select(.title == \"$title\") | .number][0] // empty")
          if [ -s boards.md ] && [ -n "$(tr -d '[:space:]' < boards.md)" ]; then
            if [ -n "$n" ]; then gh api -X PATCH "repos/$repo/issues/$n" -F body=@boards.md --silent
            else gh api "repos/$repo/issues" -f title="$title" -F body=@boards.md --silent; fi
          elif [ -n "$n" ]; then
            gh api -X PATCH "repos/$repo/issues/$n" -f state=closed -f body="Every board answers again." --silent
          fi

      # The website (GitHub Pages): static files written from the same builder database. A failure here
      # never stops the index or the cache below; the site just keeps its previous version until next run.
      # Page files (site/) pushed to main while this build ran are already live (website.yml), so the
      # newest ones are used, unless main also changed how the files are written (lighthouse/).
      - name: Write the website
        id: site
        continue-on-error: true
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && git fetch --quiet --depth=1 origin main \
             && git diff --quiet HEAD FETCH_HEAD -- lighthouse/ requirements.txt; then
            git checkout FETCH_HEAD -- site/
          fi
          python -m lighthouse site --out site_out --countries "${{ vars.LIGHTHOUSE_COUNTRIES || 'US,CA,MX' }}"
          git rev-parse HEAD > site_built_from.txt

      - name: Upload the website
        if: steps.site.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

      # Kept for website.yml: a push that changes only the page puts it live on this job data, no build.
      - name: Keep the website in the cache
        if: steps.site.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            site_out
            site_built_from.txt
          key: lighthouse-site-${{ github.run_id }}

      # Saved only after a successful publish, so the cache always matches what readers have.
      - name: Save builder database
        uses: actions/cache/save@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}

  # The free gap fill, after the index and the site are out (it runs alongside the deploy): a free, open
  # model on this machine reads the newest postings the rules couldn't settle, for LIGHTHOUSE_LLM_MINUTES
  # (variable, default 60), and titles no rule places get a category from similar titles. No key, no
  # account. The builder database is saved again with the answers, and the next build publishes them.
  # If anything here fails, nothing is lost: the next build starts from the build job's database.
  fill:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-builder.txt

      # llama.cpp's server, the open model and the title model: fetched once by scripts/get_llm.sh
      # (about 10 minutes) and kept in the cache, keyed by that script's pinned versions.
      - name: Restore the open model
        id: llm
        uses: actions/cache/restore@v4
        with:
          path: llm
          key: lighthouse-llm-${{ hashFiles('scripts/get_llm.sh') }}

      - name: Get the open model (first run, or after scripts/get_llm.sh changed)
        if: steps.llm.outputs.cache-hit != 'true'
        run: bash scripts/get_llm.sh

      - name: Keep the open model in the cache
        if: steps.llm.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: llm
          key: lighthouse-llm-${{ hashFiles('scripts/get_llm.sh') }}

      - name: Restore builder database
        uses: actions/cache/restore@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Read what the rules couldn't
        env:
          LIGHTHOUSE_LLM_SERVER: llm/bin/llama-server
          LIGHTHOUSE_LLM_MODEL: llm/model.gguf
          LIGHTHOUSE_EMBED_MODEL: llm/embed
        run: python -m lighthouse index fill --minutes "${{ vars.LIGHTHOUSE_LLM_MINUTES || 60 }}"

      # Newer than the build job's entry, so the next build starts from this one.
      - name: Save builder database
        uses: actions/cache/save@v4
        with:
          path: data/builder.db
          key: lighthouse-builder-${{ github.run_id }}-filled

  # Settings -> Pages -> Source: GitHub Actions (once). Each build replaces the whole site.
  deploy-site:
    needs: build
    if: needs.build.outputs.site == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:                    # one Pages deploy at a time, with website.yml
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # GitHub usually copies the site in under a minute, but on 2026-11-09 it was still "syncing files"
      # when the action's default 10-minute wait ran out, and the deploy was cancelled. Wait up to 30.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
