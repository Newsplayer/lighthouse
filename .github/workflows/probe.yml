# TEMPORARY (big-companies branch only): survey careers pages from GitHub's network.
# Removed before merging.
name: Probe careers pages
on:
  push:
    branches: [big-companies]
    paths: ["lighthouse/**", "config/companies.csv", ".github/workflows/probe.yml", "probe/**"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: Discover
        if: hashFiles('probe/skip-discover') == '' && hashFiles('probe/run-build') == ''
        run: python -m lighthouse discover --out census.jsonl --workers 24
      - name: Extra probes
        if: hashFiles('probe/run.py') != '' && hashFiles('probe/run-build') == ''
        run: python probe/run.py
      - name: Test build (nothing is published)
        if: hashFiles('probe/run-build') != ''
        run: |
          start=$(date +%s)
          python -m lighthouse index build --out dist --db data/test-builder.db --detail-calls 100
          echo "BUILD_SECONDS $(( $(date +%s) - start ))"
          python probe/report.py data/test-builder.db dist/manifest.json
